<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAVATCHI — Zamonaviy Onlayn Bozor & Tezkor Yetkazish</title>
    <meta name="description" content="Savatchi - O'zbekistondagi eng qulay, arzon va tezkor onlayn bozoringiz. Mahsulotlar, mevalar, maishiy texnika va kiyim-kechaklar yetkazib berish." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('savatchi_theme') || 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (t === 'evening') {
            document.documentElement.classList.add('dark', 'evening');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
